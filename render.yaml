# Render blueprint. Secrets (sync:false) are set in the Render dashboard.
# Note: floor prep tessellates IFC meshes; standard (2GB) holds the 38MB demo
# model. Region changes here only apply to NEW services created from the
# blueprint — Render won't migrate an existing service. To move regions, either
# use Render's dashboard region migration (paid plans) or delete the existing
# service and re-sync this blueprint.
services:
  - type: web
    name: ifcbox
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: IFCBOX_STORAGE
        value: cloud
      - key: IFCBOX_CACHE_DIR
        value: /tmp/ifcbox
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IFCBOX_APP_TOKEN
        sync: false
